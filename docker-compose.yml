services:
  standings:
    build: ./backend
    container_name: standings
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  board:
    build: ./frontend
    container_name: board
    restart: unless-stopped
    depends_on:
      standings:
        condition: service_healthy
    ports:
      - "8080:8080"
